name: Build Lumen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No wrapper is committed, so Gradle itself is provisioned here and
      # invoked directly as `gradle`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Report APK size
        run: |
          echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/*.apk | awk '{print "- " $9 " — " $5}' >> $GITHUB_STEP_SUMMARY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    # Only runs once a signing keystore has been added to the repository
    # secrets; until then the debug APK above is the deliverable.
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Check for signing secrets
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "No KEYSTORE_BASE64 secret set — skipping the Play bundle."
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.signed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check.outputs.signed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode keystore
        if: steps.check.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen.jks"

      - name: Build signed AAB
        if: steps.check.outputs.signed == 'true'
        env:
          LUMEN_KEYSTORE: ${{ runner.temp }}/lumen.jks
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload Play bundle
        if: steps.check.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
