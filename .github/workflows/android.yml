name: Build Lumen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No wrapper is committed, so Gradle itself is provisioned here and
      # invoked directly as `gradle`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # R8 and resource shrinking only run in the release variant. Building it
      # unsigned on every push means the first *signed* build is not also the
      # first minified one, which is two new failure modes at once.
      - name: Build release APK (unsigned, to exercise R8)
        run: gradle :app:assembleRelease --stacktrace

      - name: Report APK size
        run: |
          echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/*.apk | awk '{print "- " $9 " — " $5}' >> $GITHUB_STEP_SUMMARY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Runs the built APK on an emulator and captures screenshots. The renderer is
  # hand-written GL, so this is the only step that proves anything is on screen.
  screenshot:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: lumen-debug-apk
          path: artifact

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          # swiftshader_indirect is the software GL path; it covers ES 3.0,
          # which is what the renderer requires.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: false
          script: bash ci/screenshot.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-screenshots
          path: shots/
          if-no-files-found: warn

  release:
    # Only runs once a signing keystore has been added to the repository
    # secrets; until then the debug APK above is the deliverable.
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Check for signing secrets
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "No KEYSTORE_BASE64 secret set — skipping the Play bundle."
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.signed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check.outputs.signed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode keystore
        if: steps.check.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen.jks"

      # Both outputs are needed: the .aab is what Play accepts, the .apk is what
      # a person can actually sideload from a GitHub Release.
      - name: Build signed APK and Play bundle
        if: steps.check.outputs.signed == 'true'
        env:
          LUMEN_KEYSTORE: ${{ runner.temp }}/lumen.jks
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload signed release build
        if: steps.check.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # The release APK is the one people actually install, and the only variant
      # R8 has rewritten. Compiling it proves nothing about whether it runs, so
      # it gets installed and played here exactly like the debug build.
      - name: Enable KVM
        if: steps.check.outputs.signed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Stage release APK for the emulator
        if: steps.check.outputs.signed == 'true'
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/*.apk artifact/

      - name: Run the release build on an emulator
        if: steps.check.outputs.signed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LUMEN_PKG: com.junaidshahid.lumen
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: false
          script: bash ci/screenshot.sh

      - name: Upload release screenshots
        if: always() && steps.check.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-release-screenshots
          path: shots/
          if-no-files-found: warn
